<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hard</title>
</head>
<body>
    <script>
        for(let i=2; i<50; i++)
        {
            let isPrime = true;
            for(var j=2; j<i; j++)
            {
                if(i % j == 0)
                {
                    isPrime = false;
                    break;
                }
            }
            if(isPrime)
            {
                document.write(i);
                if(i != 47)
                {
                    document.write(", ");
                }
            }
        }

        document.write("<br><br>");

        for(let i=0; i<5; i++)
        {
            for(let j=0; j<=i; j++)
            {
                document.write("*");
            }
            document.write("<br>");
        }
    </script>
</body>
</html>
