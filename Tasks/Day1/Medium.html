<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medium</title>
</head>
<body>
    <script>
        
        let num = prompt("Enter the Tabble you want to print of :");

        for(let i=1; i<=10; i++)
        {
            document.write(num + "x" + i +"=" + (num*i));
            document.write("<br>");
        }

        document.write("<h1>Printing all the nums that are div by 5 form 1 to 100 :</h1>");
        for(let i=1; i<=100; i++)
        {
            if(i % 5 == 0)
            {
                document.write(i);
                if(i != 100)
                {
                    document.write(", ");
                }
            }
        }

        document.write("<h1>FizzBuzz Game :</h1>");
        for(let i=1; i<=30; i++)
        {
            if(i % 3 == 0 && i % 5 == 0)
            {
                document.write("FizzBuzz, ");
            }
            else if(i % 3 == 0)
            {
                document.write("Fizz, ");
            }
            else if(i % 5 == 0)
            {
                document.write("Buzz, ");
            }
            else
            {
                document.write(i +", ");
            }
            
        }

    </script>
</body>
</html>
