<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search App</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen bg-gray-950 text-white">

    <header class="border-b border-white bg-gray-900 px-4 py-5">
        <div class="mx-auto flex max-w-7xl items-center justify-between">
            <img src="images/logo.png" alt="" class="w-40">
            <button id="favBtn" class="bg-red-600 rounded-lg px-4 py-2 font-semibold hover:bg-red-700">Favorites</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-10">
        <section class="text-center mb-10">
            <h2 class="text-3xl sm:text-5xl font-extrabold mb-3">Find Your Choice <span class="text-red-500">Movies</span></h2>
            <div class="mx-auto flex max-w-xl flex-col gap-3 sm:flex-row">
                <input type="text" id="searchInput" placeholder="Search movie..." class="placeholder:text-black text-black w-full rounded-xl border border-gray-700 bg-white px-4 py-3 outline-none focus:ring-3 focus:ring-red-500">
                <button id="searchBtn" class="rounded-xl bg-red-600 px-6 py-3 font-bold hover:bg-red-700">Search</button>
            </div>
            <p id="message" class="mt-4 text-white-300"></p>
        </section>

        <section>
            <h2 id="sectionTitle" class="text-white-500 text-2xl font-bold">Search Results</h2>
            <div id="movieList" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
