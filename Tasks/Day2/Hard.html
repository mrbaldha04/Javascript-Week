<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hard</title>
</head>
<body>
    <script>
        
    document.write("<h2>Task 7</h2>");
        const arr = [1, 2, 2, 3, 3, 3, 4];
        const arr2 = [];

        for(let i=0; i<arr.length; i++)
        {
           if(!arr2.includes(arr[i]))
           {
            arr2.push(arr[i]);
           }
        }
        document.write(arr2);
        
    
    document.write("<h2>Task 8</h2>");
        const a =  [5, 12, 8, 3, 20];
        document.write("Array = " + a + "<br>");
        const f = a.filter( a => a % 2 == 0);
        document.write("Even = " + f + "<br>");
        const s = f.map(f => f*f);
        document.write("Square = " + s + "<br>");
        const t = s.reduce((sum, s) => sum + s, 0);
        document.write("Total = " + t + "<br>");




    </script>
</body>
</html>
