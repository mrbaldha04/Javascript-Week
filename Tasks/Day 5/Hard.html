<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hard</title>
</head>

<body>

    <h1>Task 7</h1>
    <button id="btn">Weather chekc</button>
    <p id="display"></p>

    <h1>Task 8</h1>
    <input type="text" id="input">
    <ul id="userList"></ul>
    <p id="display2"></p>

    <script>

// task7
        let btn = document.getElementById("btn");
        let display = document.getElementById("display");

        async function weather() {
            display.innerHTML = "Loading...";

            try {
                let api = await fetch(
                    "https://api.open-meteo.com/v1/forecast?latitude=21.17&longitude=72.83&current_weather=true");

                if (!api.ok) {
                    throw new Error("api enter mistalke");
                }

                let data = await api.json();

                display.innerHTML =
                    "Temp. = " + data.current_weather.temperature + data.current_weather_units.temperature;

            } catch (error) {
                display.innerHTML = "Error = " + error.message;
            }
        }

        btn.addEventListener("click", function () {
            weather();
        });


// task8
        let input = document.getElementById("input");
        let display2 = document.getElementById("display2");
        let userList = document.getElementById("userList");

        let  arr = [];

        async function search()
        {
            display2.innerHTML = "Loading...";
            try
            {
                let api = await fetch("https://jsonplaceholder.typicode.com/users");
                if(!api.ok)
                {
                    throw new error("api wrong, correct it");
                }
                let data = await api.json();

                display2.innerHTML = "";
                arr = data;
                allData(arr);
            }
            catch(error)
            {
                display2.innerHTML = "Error = " + error.message;
            }
        }

        function allData(data)
        {
            userList.innerHTML = "";
            data.forEach(function(d)
            {
                let li = document.createElement("li");
                li.innerHTML = d.name;
                userList.appendChild(li);
            });
        }

        input.addEventListener("input", function(){
            let i = input.value.toLowerCase();
            let o = arr.filter(o => o.name.toLowerCase().includes(i));
            allData(o);
        })

        search();

    </script>

</body>

</html>
