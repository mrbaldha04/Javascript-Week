<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>8-Puzzle</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --panel:     #161b22;
      --tile:      #1f3a5f;
      --tile-top:  #264d7e;
      --tile-edge: #0e2240;
      --empty:     #1a1f27;
      --accent:    #4d9de0;
      --text:      #e8f4fd;
      --shadow:    #07111f;
      --gap: 10px;
      --tile-size: 110px;
      --radius: 12px;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Space Mono', monospace;
      background-image:
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(77,157,224,0.07) 0%, transparent 70%),
        repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.02) 40px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.02) 40px);
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3.2rem;
      letter-spacing: 0.18em;
      color: var(--text);
      margin-bottom: 6px;
      text-shadow: 0 0 30px rgba(77,157,224,0.45);
    }

    .subtitle {
      font-size: 0.72rem;
      color: rgba(232,244,253,0.35);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-bottom: 36px;
    }

    /* ── Stats bar ── */
    .stats {
      display: flex;
      gap: 32px;
      margin-bottom: 28px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .stat-label {
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      color: rgba(232,244,253,0.3);
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    /* ── Board wrapper ── */
    .board-wrap {
      background: var(--panel);
      border: 1px solid rgba(77,157,224,0.12);
      border-radius: 20px;
      padding: 18px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04),
        0 24px 60px rgba(7,17,31,0.7),
        inset 0 1px 0 rgba(255,255,255,0.06);
    }

    /* ── Grid ── */
    .board {
      display: grid;
      grid-template-columns: repeat(3, var(--tile-size));
      grid-template-rows:    repeat(3, var(--tile-size));
      gap: var(--gap);
    }

    /* ── Tile ── */
    .tile {
      width: var(--tile-size);
      height: var(--tile-size);
      border-radius: var(--radius);
      background: linear-gradient(160deg, var(--tile-top) 0%, var(--tile) 55%, var(--tile-edge) 100%);
      border: none;
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.8rem;
      letter-spacing: 0.04em;
      color: var(--text);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.1) inset,
        0 -1px 0 rgba(0,0,0,0.4) inset,
        4px 8px 18px rgba(7,17,31,0.55),
        0 0 0 1px rgba(77,157,224,0.1);
      transition:
        transform 0.08s ease,
        box-shadow 0.08s ease,
        filter 0.08s ease;
      user-select: none;
      -webkit-user-select: none;
    }

    /* top-left corner glow dot */
    .tile::before {
      content: '';
      position: absolute;
      top: 10px; left: 10px;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
    }

    /* number badge */
    .tile span {
      position: relative;
      z-index: 1;
      text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    .tile:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.15) inset,
        0 -1px 0 rgba(0,0,0,0.5) inset,
        4px 14px 28px rgba(7,17,31,0.7),
        0 0 0 1px rgba(77,157,224,0.3),
        0 0 18px rgba(77,157,224,0.15);
      filter: brightness(1.1);
    }

    .tile:active {
      transform: translateY(1px) scale(0.97);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.08) inset,
        0 -1px 0 rgba(0,0,0,0.3) inset,
        2px 4px 10px rgba(7,17,31,0.5),
        0 0 0 1px rgba(77,157,224,0.15);
      filter: brightness(0.95);
    }

    /* ── Empty cell ── */
    .tile.empty {
      background: var(--empty);
      box-shadow:
        inset 0 2px 8px rgba(0,0,0,0.55),
        inset 0 0 0 1px rgba(0,0,0,0.3);
      cursor: default;
      pointer-events: none;
    }

    .tile.empty::before { display: none; }

    /* ── Buttons row ── */
    .controls {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      justify-content: center;
    }

    .btn {
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 10px 24px;
      border-radius: 8px;
      border: 1px solid rgba(77,157,224,0.25);
      background: rgba(77,157,224,0.08);
      color: rgba(232,244,253,0.75);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.08s;
    }

    .btn:hover {
      background: rgba(77,157,224,0.18);
      border-color: rgba(77,157,224,0.5);
      color: var(--text);
      transform: translateY(-1px);
    }

    .btn:active { transform: translateY(0); }

    .btn.primary {
      background: rgba(77,157,224,0.22);
      border-color: rgba(77,157,224,0.55);
      color: var(--text);
    }

    .btn.primary:hover {
      background: rgba(77,157,224,0.35);
    }

    /* ── Win overlay ── */
    .win-msg {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(13,17,23,0.88);
      border-radius: 20px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      backdrop-filter: blur(4px);
    }

    .win-msg.show { display: flex; }

    .win-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.6rem;
      color: var(--accent);
      letter-spacing: 0.12em;
      text-shadow: 0 0 24px rgba(77,157,224,0.6);
    }

    .win-msg p {
      font-size: 0.7rem;
      color: rgba(232,244,253,0.45);
      letter-spacing: 0.2em;
    }

    .board-outer {
      position: relative;
    }
  </style>
</head>
<body>

  <h1>ARRANGE-PUZZLE</h1>
  

  <div class="board-outer">
    <div class="board-wrap">
      <div class="board" id="board">

        <!-- Row 1 -->
        <button class="tile"  id="1" onclick="PuzzleLogic(id)">1</button>
        <button class="tile"  id="2" onclick="PuzzleLogic(id)">2</button>
        <button class="tile"  id="3" onclick="PuzzleLogic(id)">3</button>

        <!-- Row 2 -->
        <button class="tile"  id="4" onclick="PuzzleLogic(id)">4</button>
        <button class="tile"  id="null" onclick="PuzzleLogic(id)">" "</button>
        <button class="tile"  id="5" onclick="PuzzleLogic(id)">5</button>

        <!-- Row 3 -->
        <button class="tile"  id="6" onclick="PuzzleLogic(id)">6</button>
        <button class="tile"  id="7" onclick="PuzzleLogic(id)">7</button>
        <button class="tile"  id="8" onclick="PuzzleLogic(id)">8</button>

      </div>
    </div>
  </div>


  <div class="controls">
    <button class="btn" id="btnShuffle" onclick="shuffle()">Shuffle</button>
  </div>


<script>
  
  
var arr = [];

  function shuffle()
  {
    arr = []
    logic();
  }

  function logic()
  {
    for(i=0; i<100; )
    {
      var x = Math.floor(Math.random()*9)+1;

      if(!arr.includes(x))
      {
           arr.push(x);
      }

      else{
        i++;
      }
    }
    
    for(i=0; i<9; i++)
    {
      if(arr[i] == 9)
      {
        arr[i] = " ";
      }
    }

    for(i=0; i<9 ; i++)
    {
      document.getElementsByClassName('tile')[i].innerHTML = arr[i];
    }
  }

  window.onload = function()
  {
    shuffle();
  }


  function PuzzleLogic(id)
  {
    var clicked = document.getElementById(id).innerHTML;

      if(clicked != " ")
      {            
        var nullIndex = arr.indexOf(" ");
        var second = clicked;
        
          if(second != " ")
          {
            var y = parseInt(second);
            
          } 
          var clickedIndex = arr.indexOf(y);

          var clickP = clickedIndex + parseInt(1); 
          var clickM = clickedIndex - parseInt(1); 
          var clickPPP = clickedIndex + parseInt(3); 
          var clickMMM = clickedIndex - parseInt(3); 
          var diff = Math.abs(clickedIndex - nullIndex)
          var sameRow = Math.floor(clickedIndex/3) == Math.floor(nullIndex/3)
          var sameCol = Math.floor(clickedIndex%3) == Math.floor(nullIndex%3)


        if((arr[clickP] == " " || arr[clickM] == " ") && sameRow)
        {
                var temp = arr[nullIndex];
                arr[nullIndex] = arr[clickedIndex];
                arr[clickedIndex] = temp;
        }
        
        if(arr[clickPPP] == " " || arr[clickMMM] == " ")
        {
                var temp = arr[nullIndex];
                arr[nullIndex] = arr[clickedIndex];
                arr[clickedIndex] = temp;
        }

        var x = clickedIndex < nullIndex ? parseInt(1) : parseInt(-1);
        var z = clickedIndex < nullIndex ? parseInt(3) : parseInt(-3);
        if(diff == 2 && sameRow)
        {
          while(clickedIndex != nullIndex)
          {
            arr[nullIndex] = arr[nullIndex - x];
            nullIndex = nullIndex - x;
          }
          arr[clickedIndex] = " ";
        }

        if(diff == 6 && sameCol)
        {
          while(clickedIndex != nullIndex)
          {
            arr[nullIndex] = arr[nullIndex - z];
            nullIndex = nullIndex - z;
          }
          arr[clickedIndex] = " ";
        }

        for(i=0; i<9 ; i++)   
        {
          document.getElementsByClassName('tile')[i].innerHTML = arr[i];
        }

      }
  }



</script>


</body>
</html>
