<!-- 1 to 1000 Strong number print -->

<script>
	
var L;
var sum = 0;
var fact = 1;
var copy;

for(var i=1; i<=1000; i++)
{
	copy = i;
	while(copy>0)
	{
		L = copy % 10;
		for(var j=L; j>=1; j--)
		{
			fact = j * fact;
		}
		sum = sum + fact;
		fact = 1;
		copy = Math.floor(copy / 10);
	}
	if(i==sum)
	{
		document.write("<br>"+i);
	}
	sum = 0;
} 


</script>
