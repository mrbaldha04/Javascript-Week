<script>

var a = 0;
var b = 1;
var c = 1;

var n = prompt("Enter n = ",0)


for(i=0; i<n; i++)
{
	
	if(a<n)
	{
		document.write(a);
		a=b+c;
		i=a;
	}
	if(b<n)
	{
		document.write(b);
		b=c+a;
		i=b;
	}
	if(c<n)
	{
		document.write(c);
		c=a+b;
		i=c;
	}
}
