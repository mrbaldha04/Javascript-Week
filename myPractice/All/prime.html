<!-- Prime number between 1 to 100 -->

<script>
	
var p=1;

document.write("<br> 1");
document.write("<br> 2");

// logic

for(var i=3; i<=100; i++)
{
	for(var j=2; j<i; j++)
	{
		if(i%j==0)
		{
			p=0;
		}
	}
	if(p!=0)
	{
		document.write("<br>"+i);
	}
	p=1;
}

</script>
