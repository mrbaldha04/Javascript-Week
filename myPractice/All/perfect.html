<!-- 1 to 1000 Perfect number print -->

<script>
	
var sum = 0;

for(var i=1; i<=1000; i++)
{
	for(var j=1; j<i; j++)
	{
		if(i%j==0)
		{
			sum = sum + j;
		}
	}
	if(i==sum)
	{
		document.write("<br>"+i);
	}
	sum = 0;
}


</script>
